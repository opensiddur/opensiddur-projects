name: Validate projects

# Thin caller for opensiddur-processor#94: the actual schema and referential-integrity checks live
# in opensiddur-processor, which has the validators, the schema, and the tests for both. See
# opensiddur-processor/.github/workflows/validate-projects.yml.
#
# `pull_request` (not `pull_request_target`) and no secrets, so this also runs for PRs from
# forks. To make this check required: Settings -> Branches -> main -> require the status
# context this job reports (expected "Validate projects / validate") before merging.
#
# `push` to main validates every project and, more to the point, saves the cached reference
# database that PR runs restore from (opensiddur-processor#165): a PR can read caches saved on its
# base branch but not those saved by other PRs.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      opensiddur_processor_ref:
        description: >
          opensiddur-processor ref whose validators to run (branch, tag, or SHA). Empty: this PR's
          branch name if opensiddur-processor has a branch of that name (a companion PR), else main
        default: ''

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    uses: opensiddur/opensiddur-processor/.github/workflows/validate-projects.yml@main
    with:
      opensiddur_processor_ref: ${{ inputs.opensiddur_processor_ref }}
