# Before 0.7.0, the processor gave this book uniform psalm titles by its project name; from
# 0.7.0 the settings ask for them (electronic.psalm_titles).
requires_processor: ">=0.7.0"

description: Expanded Ashkenazi siddur in recitation order, with silent and repeated
  Amidah occurrences and actual Torah and haftarah readings. The reader selects date,
  location and service; unresolved alternatives retain their rubrics.
# Only the electronic book: its reader chooses the date, place and service on the device,
# and an undated printed siddur, every day's alternatives with their rubrics, is not wanted.
formats:
- html
book:
  project: siddur_expanded-opensiddur-he
  file_name: index.xml
  title: Expanded Ashkenazi Siddur
# The psalms come from several editions, which title them differently: give each whole psalm
# one heading.
electronic:
  psalm_titles: uniform
typography:
  fonts:
    hebrew:
    - name: Frank Ruehl CLM
      normal_size: 12
    - name: Ezra SIL
      normal_size: 12
    - name: SBL Hebrew
      normal_size: 12
    - name: FreeSerif
      normal_size: 12
  instructions:
    from: both
priority:
  transclusion:
  - siddur_expanded-opensiddur-he
  - chumash-opensiddur-he
  - tanakh-miqra_al_pi_hamasorah-he
  - tanakh-wlc-he
  - hasiddur_hashalem-birnbaum-1949-he
  - hasiddur_hashalem-birnbaum-1949-en
  - tanakh-jps-1917-en
  instructions:
  - siddur_expanded-opensiddur-he
  - chumash-opensiddur-he
  - hasiddur_hashalem-birnbaum-1949-he
  - hasiddur_hashalem-birnbaum-1949-en
annotations:
- hasiddur_hashalem-birnbaum-1949-en
- tanakh-miqra_al_pi_hamasorah-he
print_once:
  commentary: true
parallel:
  projects:
  - tanakh-jps-1917-en
  - hasiddur_hashalem-birnbaum-1949-en
declarations:
  opensiddur:override:
    house-of-mourning: null
  opensiddur:rite:
    ashkenaz: true
    sepharad: false
  opensiddur:reading-cycle:
    annual: true
    triennial: false
