# David Asher's Selichoth (1912), Hebrew facing English, as the book prints it.

description: >
  Asher's Selichoth, Hebrew facing English, with no date declared, so every service is
  kept. Abbreviated refrains, prayers and repetitions stay as printed, with the book's
  instructions for completing them.

# The processor before 0.7.0 built the electronic documentary book without the Full Kaddish it
# takes from Birnbaum, and failed (v0.6.0); 0.7.0 is the first release paired with the settings
# that resolve it.
requires_processor: ">=0.7.0"

book:
  project: asher_selichot_he_1912
  file_name: index.xml
  title: Asher Selichoth — documentary
priority:
  transclusion:
  - asher_selichot_he_1912
  - asher_selichot_en_1912
  # An electronic book leaves the reader's choice to expand the Full Kaddish undecided, so
  # Birnbaum's text, which supplies it, must be resolvable even though this book prints
  # the abbreviation.
  - birnbaum_ashkenaz_he_1949
  - birnbaum_ashkenaz_en_1949
  instructions:
  - asher_selichot_he_1912
  - asher_selichot_en_1912
parallel:
  projects:
  - asher_selichot_en_1912
  - birnbaum_ashkenaz_en_1949
readings:
  abbreviations: abbreviated
# The editor's notes (standoff, each beginning "Editor:") are in the English project.
annotations: [asher_selichot_en_1912]
# Each editor's note is printed once, where the book first reaches it, though the
# expanded book repeats the passages it annotates.
print_once:
  editorial: true
typography:
  page_header:
    all:
      left: סליחות
      right: '{page}'
  instructions:
    from: both
  # The release builders install Ezra SIL, not SBL Hebrew, so a release sets Ezra; SBL
  # Hebrew, its descendant, stands in where Ezra is absent. Both carry the middle dot (U+00B7)
  # that divides Asher's verses, which the Culmus faces (Frank Ruehl CLM) lack.
  fonts:
    hebrew:
    - name: Ezra SIL
      normal_size: 12
    - name: SBL Hebrew
      normal_size: 12
    - name: FreeSerif
      normal_size: 12
  table_of_contents:
    enabled: true
    depth: 2
declarations:
  asher:expansions:
    refrains_present: false
    prayers_present: false
    repetitions_present: false
