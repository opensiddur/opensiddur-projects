# David Asher's Selichoth (1912), Hebrew facing English, with what the book abbreviates supplied.

description: >
  Asher's Selichoth, Hebrew facing English, with no date declared, so every service is
  kept. The abbreviated refrains, prayers and repetitions are written out in full, and the
  Full Kaddish the book does not print is taken from Birnbaum's siddur.

# Built with the documentary book's processor, so that the two editions of the one book come
# from the same release (0.7.0, the first paired with the documentary book's fixed settings).
requires_processor: ">=0.7.0"

book:
  project: selichoth-asher-1912-he
  file_name: expanded.xml
  title: Asher Selichoth — expanded
priority:
  transclusion:
  - selichoth-asher-1912-he
  - selichoth-asher-1912-en
  - hasiddur_hashalem-birnbaum-1949-he
  - hasiddur_hashalem-birnbaum-1949-en
  instructions:
  - selichoth-asher-1912-he
  - selichoth-asher-1912-en
parallel:
  projects:
  - selichoth-asher-1912-en
  - hasiddur_hashalem-birnbaum-1949-en
readings:
  abbreviations: expanded
# The editor's notes (standoff, each beginning "Editor:") are in the English project.
annotations: [selichoth-asher-1912-en]
# Each editor's note is printed once, where the book first reaches it, though the
# expanded book repeats the passages it annotates.
print_once:
  editorial: true
typography:
  page_header:
    all:
      left: סליחות
      right: '{page}'
  instructions:
    from: both
  # The release builders install Ezra SIL, not SBL Hebrew, so a release sets Ezra; SBL
  # Hebrew, its descendant, stands in where Ezra is absent. Both carry the middle dot (U+00B7)
  # that divides Asher's verses, which the Culmus faces (Frank Ruehl CLM) lack.
  fonts:
    hebrew:
    - name: Ezra SIL
      normal_size: 12
    - name: SBL Hebrew
      normal_size: 12
    - name: FreeSerif
      normal_size: 12
  table_of_contents:
    enabled: true
    depth: 2
declarations:
  asher:expansions:
    refrains_present: true
    prayers_present: true
    repetitions_present: true
