description: Synthetic Hebrew/English book demonstrating typography and compiler features.
requires_processor: ">=0.7.0"
book:
  project: preview-he
  file_name: index.xml
priority:
  transclusion: [preview-he, preview-en]
  instructions: [preview-he, preview-en]
parallel:
  projects: [preview-he, preview-en]
  column_order: primary_first
typography:
  table_of_contents:
    enabled: true
    depth: 4
